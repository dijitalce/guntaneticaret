# VPS için nginx örneği (panel kendi sanal host dosyasını üretiyorsa ilgili bloklara taşı).
# Uygulama: node server.js  (PORT=3000). Ürün görselleri nginx'ten doğrudan sunulur:
# Node'a hiç uğramaz, sendfile ile diskten gider.
upstream guntan_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name guntanotoyedekparca.com www.guntanotoyedekparca.com
              japongrupotoyedekparca.com almangrupotoyedekparca.com italyangrupotoyedekparca.com
              fransizgrupotoyedekparca.com abdgrupotoyedekparca.com koregrupotoyedekparca.com;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

  # Ürün görselleri (hostinger-start.mjs'deki /urun-gorsel/xx/dosya.webp ile aynı yapı).
  location /urun-gorsel/ {
    alias /var/data/guntan/guntan-images/files/;   # PRODUCT_IMAGE_DIR ile aynı klasör
    sendfile on;
    tcp_nopush on;
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Next'in sabit dosyaları içerik karması taşır: bir yıl güvenle önbelleğe alınır.
  location /_next/static/ {
    proxy_pass http://guntan_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://guntan_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
